[project]
name = "pravah"
version = "2.0.0"
description = "AI Search Engine - Agentic RAG powered by LangGraph"
authors = [
    { name = "Jay Shah", email = "jayshah5696@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core LLM & Agent
    "litellm>=1.43.7",
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langsmith>=0.1.104",
    # Checkpointing
    "langgraph-checkpoint>=1.0.0",
    "aiosqlite>=0.19.0",  # Required for async SQLite checkpointing
    # Search & Retrieval
    "tavily-python>=0.3.5",
    "beautifulsoup4>=4.12.3",
    "duckduckgo-search>=6.2.9",
    "bm25s>=0.1.10",
    "rerankers[flashrank]>=0.4.0",
    "faiss-cpu>=1.8.0.post1",
    # Vector DB (optional)
    "lancedb>=0.12.0",
    "tantivy>=0.22.0",
    # LLM Providers
    "openai>=1.0.0",
    "anthropic>=0.34.2",
    "cohere>=5.8.1",
    "google-genai>=1.0.0",  # Google Gemini with grounded search
    # Document Processing
    "pymupdf4llm>=0.0.14",
    "tiktoken>=0.7.0",
    # UI & Web
    "streamlit>=1.37.1",
    "aiohttp>=3.10.3",
    # Utilities
    "jinja2>=3.1.4",
    "rich>=13.7.1",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0",
    # Storage
    "duckdb>=1.0.0",
    "fastavro>=1.9.5",
    "langchain-litellm>=0.3.5",
    "langgraph-checkpoint-sqlite>=3.0.3",
    # New: File uploads & structured output
    "markitdown[all]>=0.1.0",  # Microsoft file-to-markdown converter
    "instructor>=1.0.0",  # Pydantic structured LLM output
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pravah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".venv",
    "uv-cache",
    ".uploads_db",
    "remotion-demo",
]
